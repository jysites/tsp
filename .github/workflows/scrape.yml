name: Scrape Sportsplex Data

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-sportsplex-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium and system dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scrapers
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail

          python bball_training_scrape.py --out data/bball_training.json &
          PID_BBALL_TRAINING=$!

          python bball_camps_scrape.py --out data/bball_camps.json &
          PID_BBALL_CAMPS=$!

          python vball_camps_scrape.py --out data/vball_camps.json &
          PID_VBALL_CAMPS=$!

          python vball_training_scrape.py --out data/vball_training.json &
          PID_VBALL_TRAINING=$!

          wait "$PID_BBALL_TRAINING"
          wait "$PID_BBALL_CAMPS"
          wait "$PID_VBALL_CAMPS"
          wait "$PID_VBALL_TRAINING"

      - name: Validate JSON files
        run: |
          python -m json.tool data/bball_training.json > /dev/null
          python -m json.tool data/bball_camps.json > /dev/null
          python -m json.tool data/vball_camps.json > /dev/null
          python -m json.tool data/vball_training.json > /dev/null

      - name: Commit and push changed JSON
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/bball_training.json \
            data/bball_camps.json \
            data/vball_camps.json \
            data/vball_training.json

          if git diff --cached --quiet; then
            echo "No sports data changes detected."
            exit 0
          fi

          git commit -m "chore: update sports data [skip ci]"

          # Protect against main changing while the scraper was running.
          git pull --rebase origin main
          git push origin HEAD:main
