name: Scrape Sportsplex Data

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: scrape-sportsplex-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main before scraping
        run: |
          git fetch origin main
          git reset --hard origin/main
          
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libxkbcommon0 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run basketball training scraper
        timeout-minutes: 15
        run: python bball_training_scrape.py --out data/bball_training.json

      - name: Run basketball camps scraper
        timeout-minutes: 15
        run: python bball_camps_scrape.py --out data/bball_camps.json

      - name: Run volleyball camps scraper
        timeout-minutes: 15
        run: python vball_camps_scrape.py --out data/vball_camps.json

      - name: Run volleyball training scraper
        timeout-minutes: 15
        run: python vball_training_scrape.py --out data/vball_training.json

      - name: Commit and push updated JSON
        run: |
          run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/bball_training.json data/bball_camps.json data/vball_camps.json data/vball_training.json

          if git diff --staged --quiet; then
            echo "No JSON changes to commit"
            exit 0
          fi

          git commit -m "chore: update sports data [skip ci]"
          git push origin main
